# ============================================================
# Football Prediction Engine — Configuration
# ============================================================

project:
  name: football-prediction-engine
  timezone: UTC

# ------------------------------------------------------------
# Data sources
# ------------------------------------------------------------
data:
  # Local cache for API responses (gitignored). Keeps us within free-tier
  # request budgets by never re-fetching the same data.
  cache_dir: "data/raw"
  odds_api:
    base_url: "https://api.the-odds-api.com/v4"
    sport: "soccer_epl"          # see The Odds API sport keys
    regions: "eu"
    markets: ["h2h", "totals", "spreads"]
    # Free tier = 500 req/month per key (multi-key rotation supported).
    # Each soccer sport key below = 1 request per run, so scanning all of
    # them costs ~30 credits/day — well within the free tier.
    sport_keys: ["soccer_epl", "soccer_france_ligue_one", "soccer_germany_bundesliga",
                 "soccer_italy_serie_a", "soccer_spain_la_liga", "soccer_netherlands_eredivisie",
                 "soccer_portugal_primeira_liga", "soccer_uefa_champs_league",
                 "soccer_uefa_europa_league", "soccer_uefa_europa_conference_league",
                 "soccer_brazil_campeonato", "soccer_usa_mls", "soccer_mexico_ligamx",
                 "soccer_argentina_primera_division", "soccer_turkey_super_league",
                 "soccer_belgium_first_div", "soccer_spl", "soccer_greece_super_league",
                 "soccer_denmark_superliga", "soccer_sweden_allsvenskan",
                 "soccer_norway_eliteserien", "soccer_australia_aleague",
                 "soccer_japan_j_league", "soccer_korea_kleague1", "soccer_china_superleague",
                 "soccer_saudi_arabia_pro_league", "soccer_russia_premier_league",
                 "soccer_poland_ekstraklasa", "soccer_switzerland_superleague",
                 "soccer_efl_champ"]
    daily_budget: 500
  oddspapi:
    # PRIMARY odds source — free historical odds + line-movement analysis,
    # 300+ bookmakers. Auth: apiKey query param.
    base_url: "https://api.oddspapi.io"
    sport_id: 10                 # 10 = soccer
    bookmaker: "pinnacle"
    daily_budget: 500
  football_api:
    base_url: "https://v3.football.api-sports.io"
    league_id: 39                # 39 = EPL, 140 = La Liga, etc. (primary)
    # ALL leagues to scan today — the pipeline pulls fixtures from every
    # league in this list, so it covers matches worldwide, not just one.
    # (API-Football league ids: 39 EPL, 140 La Liga, 135 Serie A, 78
    # Bundesliga, 61 Ligue 1, 2 Champions League, 3 Europa League, 4
    # Conference League, 169 Brazil, 128 Argentina, 253 MLS, 88 Eredivisie,
    # 94 Primeira Liga, 179 Scotland, 203 Turkey, 172 Russia, 345 Portugal...)
    league_ids: [39, 140, 135, 78, 61, 2, 3, 4, 169, 128, 253, 88, 94, 179, 203, 172, 345, 71, 72, 73, 74, 75, 76, 77, 79, 80, 81, 82, 83, 84, 85, 86, 87, 89, 90, 91, 92, 93, 95, 96, 97, 98, 99, 100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 129, 130, 131, 132, 133, 134, 136, 137, 138, 139, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 156, 157, 158, 159, 160, 161, 162, 163, 164, 165, 166, 167, 168, 170, 171, 173, 174, 175, 176, 177, 178, 180, 181, 182, 183, 184, 185, 186, 187, 188, 189, 190, 191, 192, 193, 194, 195, 196, 197, 198, 199, 200, 201, 202, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224, 225, 226, 227, 228, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 239, 240, 241, 242, 243, 244, 245, 246, 247, 248, 249, 250, 251, 252, 254, 255, 256, 257, 258, 259, 260, 261, 262, 263, 264, 265, 266, 267, 268, 269, 270, 271, 272, 273, 274, 275, 276, 277, 278, 279, 280, 281, 282, 283, 284, 285, 286, 287, 288, 289, 290, 291, 292, 293, 294, 295, 296, 297, 298, 299, 300, 301, 302, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 316, 317, 318, 319, 320, 321, 322, 323, 324, 325, 326, 327, 328, 329, 330, 331, 332, 333, 334, 335, 336, 337, 338, 339, 340, 341, 342, 343, 344, 345]
    # NOTE: the API-Football FREE plan only has access to seasons 2022-2024.
    # We train on ALL of them (3 full seasons ≈ 1,140 EPL matches) instead of
    # a single season. Today's fixtures come from OddsPapi (which has the
    # current season) when this returns nothing.
    seasons: [2022, 2023, 2024]
    season: 2024                 # primary/fallback season (kept for compat)
    # Free tier = 100 req/day per key (multi-key rotation supported).
    # Per-match statistics cost 1 request each, so we only enrich the most
    # recent N completed fixtures per run.
    daily_budget: 90
    max_stats_fixtures: 60
  football_data:
    # football-data.org — free tier: 12 competitions, 10 calls/min.
    # Provides fixtures/results/standings (NO xG/corners/cards on free tier).
    base_url: "https://api.football-data.org/v4"
    daily_budget: 100
    # Competition codes to fetch historical results for (free tier).
    # BSA = Brazil Serie A (the odds feed returns lots of Brazilian fixtures).
    competitions: ["PL", "ELC", "BL1", "SA", "PD", "FL1", "DED", "PPL", "CL", "BSA"]
    seasons: [2025, 2024]
  football_data_co_uk:
