# ------------------------------------------------------------
# Feature engineering
# ------------------------------------------------------------
features:
  ema_windows: [3, 5, 10]
  elo:
    k: 32
    home_advantage: 65
    margin_factor: 1.0
    init_rating: 1500
  kpai:
    top_n: 3                     # top-N key players tracked for availability
  venue:
    window: 20                   # home games used for fortress index
  h2h:
    window: 10                   # recent H2H meetings considered

# ------------------------------------------------------------
# LLM expert (DeepSeek V4 Flash via dahl.global inference API)
# ------------------------------------------------------------
llm:
  base_url: "https://inference.dahl.global/v1"
  model: "deepseek-ai/DeepSeek-V4-Flash-0731"
  temperature: 0.0
  # Output budget: V4 Flash supports up to 300k output tokens. We use a
  # generous but sane default so the expert can return a full per-market
  # probability breakdown + reasoning. Raise it if you want even richer
  # output (costs more tokens per call).
  max_tokens: 8000
  # Context budget: V4 Flash supports 350k context tokens. When
  # rich_context is true, the expert receives raw recent form, H2H,
  # injuries and odds — not just a compressed feature summary.
  max_context_tokens: 350000
  rich_context: true
  # Blend weight for the LLM expert vs statistical workers (0.3 = 30% LLM)
  mix_weight: 0.3
  fine_tune:
    # dahl.global is OpenAI-compatible, so fine-tuning uses the SAME
    # endpoint + key as inference (no separate DeepSeek platform needed).
    # Override with DEEPSEEK_FT_BASE_URL if your provider differs.
    base_url: "https://inference.dahl.global/v1"
    base_model: "deepseek-ai/DeepSeek-V4-Flash-0731"

# ------------------------------------------------------------
# Models
# ------------------------------------------------------------
models:
  # auto = try xgboost -> lightgbm -> sklearn HistGradientBoosting
  backend: auto
  worker:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.9
    colsample_bytree: 0.9
  calibration:
    method: isotonic            # isotonic | sigmoid
    cv: 5
  conformal:
    # Risk gate: the master brain abstains when the prediction set spans
    # more than one class AND the top-class probability is below `floor`.
    # (alpha is the coverage level; floor is the confidence needed to pass.)
    alpha: 0.10
    calibration_fraction: 0.20
    floor: 0.85
  anomaly:
    contamination: 0.05
    random_state: 42

# ------------------------------------------------------------
# Market scanning & selection
# ------------------------------------------------------------
markets:
  thresholds:
    # Safe markets (team O0.5, AH +2.5, corners O6.5...) clear this floor.
    # Lowered from 0.985 so the pipeline can actually produce selections on
    # real data (0.985 was unreachable in practice).
    high_floor: 0.90
    # Other markets (double chance / totals) clear at 0.80.
    primary: 0.80
  max_goals: 6                  # max goals in the Poisson matrix
  min_edge: 0.02                # minimum model-vs-implied edge to accept
  basketball:
    # Default lines used when no live odds are attached (mock mode).
    spread: -5.5                # home team spread
    alt_spread: -12.5           # alternate spread (high-floor line)
    total_line: 220.5           # over/under total
    home_total: 108.5           # home team total line

# ------------------------------------------------------------
# Accumulator / ticket building
# ------------------------------------------------------------
pipeline:
  target_odds: 300.0
  # Confidence floor for the accumulator. Lowered from 0.985 so selections
  # can actually ship; the master brain's own thresholds (high_floor/primary)
  # still gate what gets EXECUTEd.
  min_confidence: 0.90
  max_legs: 30
  max_same_match_legs: 1         # never stack correlated same-match legs
  # How close to the target we need to land before stopping the downgrade
  # loop (fraction of target, e.g. 0.05 = ±5% of 300 = 285..315).
  target_tolerance: 0.05
  # Top-N ranked markets per fixture exposed as downgrade variants so the
  # accumulator can make a pick "leaner" (e.g. home_win -> home_or_draw)
  # to fine-tune the total odds toward the target.
  max_variants_per_fixture: 5
  # Betting window: only fixtures that kick off between now and this local
  # end time are considered. Matches already started (e.g. 9am when run at
  # 10am) are excluded automatically.
  # days_ahead extends the window N days beyond today (0 = today only). The
  # odds feed returns games for the next ~3 weeks, and the big European
  # leagues (EPL, La Liga...) mostly play on weekends — so 7 lets the engine
  # evaluate the next weekend's slate, which is where the model has real
  # training data. (With a short window it only sees a handful of South
  # American/MLS games the model wasn't trained on.)
  kickoff_window:
    start: "now"
    end: "23:30"
    days_ahead: 7
  # ALL-OR-NOTHING rule: if ANY leg fails the whole ticket is a loss.
  # System-bet splits (4/5, 5/6...) hedge against single-leg risk and
  # contradict that rule, so they are OFF by default. Set true to re-enable.
  system_bets: false
  # Used when no live odds are available (mock mode): model-estimated
  # fair odds so the accumulator can still build a ticket.
  default_odds: 1.15

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  dir: output
  ticket_file: todays_ticket.json
  report_file: daily_report.json
