name: Daily High-Odds Prediction Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC to evaluate the daily match slate
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_odds:
        description: 'Target Combined Odds'
        required: false
        default: '300.0'
      min_confidence:
        description: 'Minimum Selection Confidence (hard floor, e.g., 0.985)'
        required: false
        default: '0.985'
      use_llm:
        description: 'Use DeepSeek LLM expert (requires DEEPSEEK_API_KEY)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  train-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies (heavy stack on runner)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Engine & Run Daily Prediction
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_KEYS: ${{ secrets.FOOTBALL_API_KEYS }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_KEYS: ${{ secrets.ODDSPAPI_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          TARGET_ODDS: ${{ github.event.inputs.target_odds || '300.0' }}
          MIN_CONFIDENCE: ${{ github.event.inputs.min_confidence || '0.985' }}
        run: |
          python scripts/run_daily.py

      - name: Upload Prediction Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-ticket-${{ github.run_id }}
          path: |
            output/todays_ticket.json
            output/daily_report.json

      - name: Send Webhook Notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from src.utils.notify import notify_ticket; import json; notify_ticket(json.load(open('output/todays_ticket.json')))"

  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: train-and-predict
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Forward-Only Shadow Backtest
        run: |
          python scripts/backtest.py

      - name: Upload Backtest Report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report-${{ github.run_id }}
          path: output/

  # NOTE: fine-tune-deepseek removed — dahl.global is inference-only and
  # DeepSeek fine-tuning requires payment. The LLM expert is improved via
  # prompting (prompts/system_prompt.md) instead of fine-tuning.
